name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

# Release settings (machines, timeouts, artifact retention, platforms) live in the "release" section
# of product.conf.json; the prepare job reads them and passes them to the other jobs.
jobs:
  prepare:
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      settings: ${{ steps.plan.outputs.settings }}
      googlePlay: ${{ steps.plan.outputs.googlePlay }}
      appStore: ${{ steps.plan.outputs.appStore }}
    # This job reads the settings, so its own machine and time limit cannot come from them.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The history of the default branch, for the tag check below.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json

      - name: Check that the tag points to a commit on the default branch
        run: node scripts/release/release.mjs check-tag

      - name: Plan the release
        id: plan
        env:
          MAC_SELF_HOSTED_RUNNER: ${{ vars.MAC_SELF_HOSTED_RUNNER }}
        run: node scripts/release/release.mjs plan

      - name: Check release settings
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY && secrets.RELEASES_TOKEN || github.token }}
          RELEASES_REPOSITORY: ${{ secrets.RELEASES_REPOSITORY }}
          RELEASES_TOKEN_SET: ${{ secrets.RELEASES_TOKEN != '' }}
        run: node scripts/release/release.mjs check

  # The same checks as the Check workflow, including the desktop startup test; nothing is built until
  # they pass.
  check:
    uses: ./.github/workflows/test-and-lint.yml

  build:
    needs: [prepare, check]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.builds) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.settings).timeoutMinutes.build }}
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and check desktop installers
        if: matrix.desktop != ''
        run: node scripts/release/release.mjs desktop-package ${{ matrix.desktop }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # The packaged app looks for updates in the releases repository.
          RELEASES_REPOSITORY: ${{ secrets.RELEASES_REPOSITORY }}

      - name: Retain desktop installers
        if: matrix.desktop != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.desktop }}
          path: ${{ runner.temp }}/release-output/desktop/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.prepare.outputs.settings).artifactRetentionDays }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: matrix.mobile == 'android'
        with:
          distribution: ${{ fromJSON(needs.prepare.outputs.settings).javaDistribution }}
          java-version: ${{ fromJSON(needs.prepare.outputs.settings).javaVersion }}

      - name: Build mobile app
        if: matrix.mobile != ''
        id: mobile
        run: node scripts/release/release.mjs mobile-build ${{ matrix.mobile }}
        # Each build gets only the signing secrets of its own platform.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ matrix.mobile == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.mobile == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.mobile == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.mobile == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
          IOS_CERTIFICATE_BASE64: ${{ matrix.mobile == 'ios' && secrets.IOS_CERTIFICATE_BASE64 || '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ matrix.mobile == 'ios' && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ matrix.mobile == 'ios' && secrets.IOS_PROVISIONING_PROFILE_BASE64 || '' }}

      - name: Retain signed APK
        if: matrix.mobile == 'android' && steps.mobile.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: ${{ runner.temp }}/release-output/mobile/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.prepare.outputs.settings).artifactRetentionDays }}

      # The signed store package is kept as an artifact for the store uploads after the release.
      - name: Retain store package
        if: matrix.mobile != '' && steps.mobile.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.mobile }}-store
          path: ${{ runner.temp }}/release-output/store/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.prepare.outputs.settings).artifactRetentionDays }}

      - name: Retain test build
        if: matrix.mobile != '' && steps.mobile.outputs.signed != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.mobile }}-test
          path: ${{ runner.temp }}/release-output/test/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.prepare.outputs.settings).artifactRetentionDays }}

      - name: Remove temporary signing files
        if: always()
        run: node scripts/release/release.mjs cleanup

  release:
    name: GitHub release
    needs: [prepare, build]
    outputs:
      published: ${{ steps.publish.outputs.published }}
    # Releases commit to the releases repository one at a time.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    # Needed only when releases go to this repository; a releases repository uses RELEASES_TOKEN.
    permissions:
      contents: write
    runs-on: ${{ fromJSON(needs.prepare.outputs.settings).runners.linux }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.settings).timeoutMinutes.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The write token of this job is used only by the publish step.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json

      - name: Download built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/release-files
          pattern: '{desktop-*,android}'
          merge-multiple: true

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY && secrets.RELEASES_TOKEN || github.token }}
          RELEASES_REPOSITORY: ${{ secrets.RELEASES_REPOSITORY }}
        run: node scripts/release/release.mjs publish "$RUNNER_TEMP/release-files"

  # The store uploads run after the release, each in its own job, so a failed upload can be rerun
  # without touching the release.
  google-play:
    name: Google Play (Android)
    needs: [prepare, release]
    if: needs.prepare.outputs.googlePlay == 'true' && needs.release.outputs.published == 'true'
    runs-on: ${{ fromJSON(needs.prepare.outputs.settings).runners.linux }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.settings).timeoutMinutes.googlePlay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json

      - name: Download signed Android store package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/store-files
          pattern: android-store
          merge-multiple: true

      - name: Submit Android AAB to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: node scripts/release/release.mjs google-play "$RUNNER_TEMP/store-files"

  app-store:
    name: App Store Connect (iOS)
    needs: [prepare, release]
    if: needs.prepare.outputs.appStore == 'true' && needs.release.outputs.published == 'true'
    runs-on: ${{ fromJSON(needs.prepare.outputs.settings).runners.mac }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.settings).timeoutMinutes.appStore }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json

      - name: Download signed iOS store package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/store-files
          pattern: ios-store
          merge-multiple: true

      - name: Upload iOS build to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: node scripts/release/release.mjs app-store "$RUNNER_TEMP/store-files"

  # Starts the retry workflow only when a job failed or got no machine (GitHub marks that job
  # cancelled), so a passing release leaves no retry run. A release cancelled by hand is not retried.
  retry:
    name: Retry runner shortages
    needs: [prepare, check, build, release, google-play, app-store]
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Start the retry workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run retry.yml -f run_id="$GITHUB_RUN_ID" -f run_attempt="$GITHUB_RUN_ATTEMPT"
